<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Slanted Billboard Showcase</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Proxima Nova', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 520px;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 480px;
            display: flex;
            align-items: center;
            overflow: hidden;
            background: #000000;
            border-radius: 12px;
        }

        .slider-track {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 0 50px;
            transition: transform 0.5s ease-in-out;
            width: max-content;
        }

        .apparel-slide {
            width: 250px;
            height: 360px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(245, 237, 227, 0.2);
            transform: skewX(-12deg); 
            filter: brightness(0.7) sepia(20%); 
            transition: transform 0.4s ease, filter 0.4s ease, box-shadow 0.4s ease;
        }

        .apparel-slide img {
            display: block !important;
            width: 130% !important; 
            height: 100% !important;
            object-fit: cover !important;
            transform: skewX(12deg) scale(1.1); 
            transition: transform 0.4s ease;
            pointer-events: none;
        }

        .apparel-slide:hover {
            transform: skewX(0deg) scale(1.08); 
            filter: brightness(1.1) sepia(0%); 
            box-shadow: 0 0 25px #f5ede3, 0 20px 40px rgba(0,0,0,0.8); 
            z-index: 99;
        }

        .apparel-slide:hover img {
            transform: skewX(0deg) scale(1); 
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #f5ede3;
            border: 1px solid rgba(245, 237, 227, 0.3);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .nav-arrow:hover {
            background: #f5ede3;
            color: #000000;
        }

        .left-btn { left: 20px; }
        .right-btn { right: 20px; }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-content {
            background: #121212;
            border: 1px solid rgba(245, 237, 227, 0.2);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
            opacity: 1;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .close-popup {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            color: #f5ede3;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .popup-title {
            color: #f5ede3;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .popup-desc {
            color: #b3b3b3;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .popup-btn {
            background: #7d4900;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .popup-btn:hover { background: #965900; }

        @media (max-width: 768px) {
            body { height: 400px; }
            .slider-wrapper { height: 360px; }
            .slider-track { gap: 20px; padding: 0 20px; }
            .apparel-slide { width: 170px; height: 250px; transform: skewX(-8deg); }
            .apparel-slide img { transform: skewX(8deg) scale(1.1); width: 120%; }
            .nav-arrow { width: 36px; height: 36px; font-size: 1rem; }
            .left-btn { left: 5px; }
            .right-btn { right: 5px; }
        }
    </style>
</head>
<body>

<div class="slider-wrapper">
    <button class="nav-arrow left-btn" onclick="rotatePrev()">❮</button>
    <div class="slider-track" id="main-carousel-track"></div>
    <button class="nav-arrow right-btn" onclick="rotateNext()">❯</button>
</div>

<div class="popup-overlay" id="item-popup" onclick="closeDetails(event)">
    <div class="popup-content">
        <button class="close-popup" onclick="closeDetailsForce()">&times;</button>
        <div class="popup-title" id="pop-title">Item Gear Drop</div>
        <div class="popup-desc" id="pop-desc">Loading details...</div>
        <button class="popup-btn" id="pop-link-btn" onclick="goToWixProduct()">View Full Product</button>
    </div>
</div>

<script>
    // FIXED DYNAMIC TRACK CODES: Directly routes to your live store asset tracks
    const myShowcaseGear = [
        { 
            image: "https://wixstatic.com", 
            title: "The Arcade Hood", 
            description: "Men's Premium heavy cotton drop. Designed for the streets, engineered for comfort.",
            link: "https://rofaiva.co.nz"
        },
        { 
            image: "https://wixstatic.com", 
            title: "Women's Pasifika Hood", 
            description: "Original Ar.Ti custom graphic work celebrating raw authentic culture.",
            link: "https://rofaiva.co.nz"
        }
    ];

    const track = document.getElementById('main-carousel-track');
    let currentIndex = 0;
    let activeWixTargetUrl = "";

    myShowcaseGear.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = 'apparel-slide';
        slide.innerHTML = `<img src="${item.image}" alt="${item.title}">`;
        
        slide.addEventListener('click', () => {
            openDetails(item);
        });
        
        track.appendChild(slide);
    });

    const slides = Array.from(track.children);

    function updateCarouselLayout() {
        if (slides.length === 0) return;
        const slideWidth = 250;
        const gap = 40; 
        const amountToMove = currentIndex * (slideWidth + gap);
        track.style.transform = `translateX(-${amountToMove}px)`;
    }

    function rotateNext() {
        currentIndex = (currentIndex + 1) % slides.length;
        updateCarouselLayout();
    }

    function rotatePrev() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateCarouselLayout();
    }

    let glideTimer = setInterval(rotateNext, 4500);

    const wrapper = document.querySelector('.slider-wrapper');
    wrapper.addEventListener('mouseenter', () => clearInterval(glideTimer));
    wrapper.addEventListener('mouseleave', () => glideTimer = setInterval(rotateNext, 4500));

    function openDetails(item) {
        document.getElementById('pop-title').textContent = item.title;
        document.getElementById('pop-desc').textContent = item.description;
        activeWixTargetUrl = item.link;
        document.getElementById('item-popup').classList.add('active');
    }

    function closeDetails(e) {
        if (e.target.id === 'item-popup') {
            document.getElementById('item-popup').classList.remove('active');
        }
    }

    function closeDetailsForce() {
        document.getElementById('item-popup').classList.remove('active');
    }

    function goToWixProduct() {
        if (activeWixTargetUrl) {
            window.open(activeWixTargetUrl, '_blank');
        }
    }

    let touchStartX = 0;
    wrapper.addEventListener('touchstart', e => touchStartX = e.touches.clientX, {passive: true});
    wrapper.addEventListener('touchend', e => {
        const diff = e.changedTouches.clientX - touchStartX;
        if (Math.abs(diff) > 40) {
            if (diff > 0) rotatePrev();
            else rotateNext();
        }
    }, {passive: true});

    updateCarouselLayout();
</script>
</body>
</html>
