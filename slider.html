<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall 3D Carousel</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Proxima Nova', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 520px;
        }

        /* 3D Curved Carousel Container - Styled in Light Grey per your brilliant discovery! */
        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #D3D3D3; 
            border-radius: 0px;
            perspective: 1200px; 
        }

        /* Re-balanced track frame dimensions to match child panels safely */
        .slider-track {
            position: relative;
            width: 360px; 
            height: 480px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* TALL BOOK COVER SLIDES */
        .apparel-slide {
            position: absolute;
            width: 260px;
            height: 380px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, filter 0.6s;
            transform-origin: center center;
            -webkit-user-drag: none;
            border: 1px solid rgba(245, 237, 227, 0.15);
        }

        .apparel-slide img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            pointer-events: none;
        }

        /* THE MICHAEL JACKSON NEON GLOW HOVER PULSE */
        .apparel-slide:hover {
            box-shadow: 0 0 25px #595959, 0 25px 50px rgba(0,0,0,0.9) !important; 
            filter: brightness(1.1) !important;
            z-index: 99 !important;
        }

        /* Minimalist Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #D3D3D3;
            border: 1px solid rgba(245, 237, 227, 0.3);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .nav-arrow:hover {
            background: #f5ede3;
            color: #000000;
        }

        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        /* Lightbox Detail Overlay Popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-content {
            background: #121212;
            border: 1px solid rgba(245, 237, 227, 0.2);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
            opacity: 1;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .close-popup {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            color: #f5ede3;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .popup-title {
            color: #f5ede3;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .popup-desc {
            color: #b3b3b3;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .popup-btn {
            background: #7d4900; /* Repaired hex code assignment tracking */
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .popup-btn:hover { background: #f5ede3; color: #000000; }

        @media (max-width: 768px) {
            body { height: 420px; }
            .slider-wrapper { height: 380px; }
            .slider-track { width: 180px; height: 260px; }
            .apparel-slide { width: 180px; height: 260px; }
            .nav-arrow { width: 36px; height: 36px; font-size: 1rem; }
            .left-btn { left: 10px; }
            .right-btn { right: 10px; }
        }
    </style>
</head>
<body>

<div class="slider-wrapper">
    <button class="nav-arrow left-btn" onclick="rotatePrev()">❮</button>
    <div class="slider-track" id="main-carousel-track"></div>
    <button class="nav-arrow right-btn" onclick="rotateNext()">❯</button>
</div>

<div class="popup-overlay" id="item-popup" onclick="closeDetails(event)">
    <div class="popup-content">
        <button class="close-popup" onclick="closeDetailsForce()">&times;</button>
        <div class="popup-title" id="pop-title">Item Gear Drop</div>
        <div class="popup-desc" id="pop-desc">Loading details...</div>
        <button class="popup-btn" id="pop-link-btn" onclick="goToWixProduct()">View Full Product</button>
    </div>
</div>

<script>

            link: "https://rofaiva.co.nz"
        }

    const track = document.getElementById('main-carousel-track');

        slide.addEventListener('click', () => {

                openDetails(item); // Unified parameter variable routing
            } else {
                currentIndex = index;
                updateCarouselLayout();
            }
