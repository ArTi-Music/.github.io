<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ar.Ti Off The Wall Showcase</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Proxima Nova', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 520px;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #000000;
            border-radius: 12px;
            perspective: 1200px; 
        }

        .slider-track {
            position: relative;
            width: 260px; 
            height: 380px; 
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .apparel-slide {
            position: absolute;
            width: 260px;
            height: 380px;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s, filter 0.6s;
            transform-origin: center center;
            -webkit-user-drag: none;
            border: 1px solid rgba(245, 237, 227, 0.15);
        }

        .apparel-slide img {
            display: block !important;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        .apparel-slide:hover {
            box-shadow: 0 0 25px #f5ede3, 0 25px 50px rgba(0,0,0,0.9) !important; 
            filter: brightness(1.1) !important;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #f5ede3;
            border: 1px solid rgba(245, 237, 227, 0.3);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
            transition: background 0.2s, color 0.2s;
            user-select: none;
        }

        .nav-arrow:hover {
            background: #f5ede3;
            color: #000000;
        }

        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-content {
            background: #121212;
            border: 1px solid rgba(245, 237, 227, 0.2);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
            opacity: 1;
        }

        .popup-overlay.active .popup-content {
            transform: scale(1);
        }

        .close-popup {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            color: #f5ede3;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .popup-title {
            color: #f5ede3;
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .popup-desc {
            color: #b3b3b3;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .popup-btn {
            background: #7d4900;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .popup-btn:hover { background: #965900; }

        @media (max-width: 768px) {
            body { height: 420px; }
            .slider-wrapper { height: 380px; }
            .slider-track, .apparel-slide { width: 180px; height: 260px; }
            .nav-arrow { width: 36px; height: 36px; font-size: 1rem; }
            .left-btn { left: 10px; }
            .right-btn { right: 10px; }
        }
    </style>
</head>
<body>

<div class="slider-wrapper">
    <button class="nav-arrow left-btn" onclick="rotatePrev()">&#10094;</button>
    <div class="slider-track" id="main-carousel-track"></div>
    <button class="nav-arrow right-btn" onclick="rotateNext()">&#10095;</button>
</div>

<div class="popup-overlay" id="item-popup" onclick="closeDetails(event)">
    <div class="popup-content">
        <button class="close-popup" onclick="closeDetailsForce()">&times;</button>
        <div class="popup-title" id="pop-title">Item Gear Drop</div>
        <div class="popup-desc" id="pop-desc">Loading details...</div>
        <button class="popup-btn" id="pop-link-btn" onclick="goToWixProduct()">View Full Product</button>
    </div>
</div>

<script>
    const myShowcaseGear = [
        { 
            image: "https://static.wixstatic.com/media/d89c2f_79074dfbc4b440fcb83fb29b1ccaddc5~mv2.png/v1/fill/w_676,h_894,al_c,usm_0.66_1.00_0.01/d89c2f_79074dfbc4b440fcb83fb29b1ccaddc5~mv2.png", 
            title: "The Arcade Hood", 
            description: "Thick premium hoodie designed for the streets.",
            link: "https://rofaiva.co.nz"
        },
        { 
            image: "https://wixstatic.com", 
            title: "Pasifika Hood", 
            description: "Original Ar.Ti custom graphic work celebrating raw authentic culture.",
            link: "https://rofaiva.co.nz"
        }
    ];

    const track = document.getElementById('main-carousel-track');
    let currentIndex = 0;
    let activeWixTargetUrl = "";

    myShowcaseGear.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = 'apparel-slide';
        slide.innerHTML = `<img src="${item.image}" alt="${item.title}">`;
        
        slide.addEventListener('click', () => {
            if (index === currentIndex) {
                openDetails(item);
            } else {
                currentIndex = index;
                updateCarouselLayout();
            }
        });
        
        track.appendChild(slide);
    });

    const slides = Array.from(track.children);

    function updateCarouselLayout() {
        const total = slides.length;
        slides.forEach((slide, index) => {
            let offset = index - currentIndex;
            
            if (offset < -Math.floor(total / 2)) offset += total;
            if (offset > Math.floor(total / 2)) offset -= total;

            const absOffset = Math.abs(offset);
            
            if (offset === 0) {
                slide.style.transform = `translateX(0) scale(1.1) rotateY(0deg) translateZ(50px)`;
                slide.style.zIndex = 10;
                slide.style.opacity = 1;
                slide.style.filter = "none";
            } else if (offset === 1 || (offset < 0 && absOffset === total - 1)) {
                slide.style.transform = `translateX(150px) scale(0.82) rotateY(-40deg) translateZ(0px)`;
                slide.style.zIndex = 5;
                slide.style.opacity = 0.55;
                slide.style.filter = "blur(1px) grayscale(30%)";
            } else if (offset === -1 || (offset > 0 && absOffset === total - 1)) {
                slide.style.transform = `translateX(-150px) scale(0.82) rotateY(40deg) translateZ(0px)`;
                slide.style.zIndex = 5;
                slide.style.opacity = 0.55;
                slide.style.filter = "blur(1px) grayscale(30%)";
            } else {
                slide.style.transform = `translateX(${offset * 180}px) scale(0.5) translateZ(-300px)`;
                slide.style.zIndex = 1;
                slide.style.opacity = 0;
            }
        });
    }

    function rotateNext() {
        currentIndex = (currentIndex + 1) % slides.length;
        updateCarouselLayout();
    }

    function rotatePrev() {
        currentIndex = (currentIndex - 1 + slides.length) % slides.length;
        updateCarouselLayout();
    }

    let glideTimer = setInterval(rotateNext, 4500);

    const wrapper = document.querySelector('.slider-wrapper');
    wrapper.addEventListener('mouseenter', () => clearInterval(glideTimer));
    wrapper.addEventListener('mouseleave', () => glideTimer = setInterval(rotateNext, 4500));

    function openDetails(item) {
        document.getElementById('pop-title').textContent = item.title;
        document.getElementById('pop-desc').textContent = item.description;
        activeWixTargetUrl = item.link;
        document.getElementById('item-popup').classList.add('active');
    }

    function closeDetails(e) {
        if (e.target.id === 'item-popup') {
