<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Edge Audio Player</title>
    
    <style>
        /* =========================================================
           🛠️ EASY CUSTOMISATION PANEL - CHANGE YOUR DESIGN HERE
           ========================================================= */
        :root {
            /* 1. FONTS & TEXT */
            --player-font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --title-font-size: 10px;
            --artist-font-size: 10px;
            
            /* 2. BRAND COLORS */
            --text-color-main: #ffffff;      /* Song title color */
            --text-color-sub: #aaaaaa;       /* Artist name color */
            --button-color: #ffffff;         /* Control buttons color */
            --button-hover-color: #d6ab6f;   /* Button color when hovered */
            --background-color: #000000;     /* SOLID BLACK BACKGROUND */
            
            /* 3. OPTIONAL TOGGLES (Change 'flex' to 'none' to hide) */
            --show-previous-button: flex;    
            --show-next-button: flex;        
            --show-volume-controls: flex;     
        }

        /* =========================================================
           CORE STYLES
           ========================================================= */
        body {
            margin: 0;
            padding: 3px;
            background: transparent; 
            display: flex;
            justify-content: center;
        }

        /* Ultra-compact horizontal player container with straight edges */
        .minimal-player {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--background-color);
            border: none;               /* REMOVED BORDERS */
            border-radius: 0px;         /* STRAIGHT CORNERS */
            padding: 8px 11px;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            font-family: var(--player-font-family);
        }

        /* Button controls group */
        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            background: none;
            border: none;
            color: var(--button-color);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s, transform 0.1s;
        }

        .btn:hover { color: var(--button-hover-color); }
        .btn:active { transform: scale(0.9); }

        #prev-btn { display: var(--show-previous-button); }
        #next-btn { display: var(--show-next-button); }
        
        /* Advanced Volume Container (Icon + Slider) */
        .volume-control-group { 
            display: var(--show-volume-controls); 
            align-items: center; 
            gap: 3px;
        }

        .volume-slider {
            width: 40px;
            height: 4px;
            accent-color: var(--button-color);
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        
        .volume-slider:hover {
            opacity: 2;
            accent-color: var(--button-hover-color);
        }

        /* Text area for Titles */
        .track-info {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .song-title {
            color: var(--text-color-main);
            font-size: var(--title-font-size);
            font-weight: 600;
            margin: 0;
        }

        .artist-name {
            color: var(--text-color-sub);
            font-size: var(--artist-font-size);
            font-weight: 400;
            margin: 2px 0 0 0;
        }

        /* Hidden standard player core */
        audio { display: none; }
    </style>
</head>
<body>

<div class="minimal-player">
    <!-- Hidden Core Audio Engine -->
    <audio id="audio-player"></audio>

    <!-- UI Symbol Control Buttons -->
    <div class="controls">
        <button class="btn" id="prev-btn" title="Previous">⏮</button>
        <button class="btn" id="play-btn" title="Play">▶</button>
        <button class="btn" id="next-btn" title="Next">⏭</button>
    </div>

    <!-- Minimal Track Meta Data Display -->
    <div class="track-info">
        <div class="song-title" id="display-title">Loading track...</div>
        <div class="artist-name" id="display-artist">Artist</div>
    </div>

    <!-- Advanced Volume Controller -->
    <div class="volume-control-group">
        <button class="btn" id="volume-btn" title="Mute/Unmute">🔊</button>
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
    </div>
</div>

<li data-src="https://static.wixstatic.com/mp3/d89c2f_7d1a3ec1dc8f45e493e403019cb1278d.mp3" data-title="Freak-a-zoid" data-artist="Midnight Star"></li>

<script>
    const audioPlayer = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const volumeBtn = document.getElementById('volume-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const displayTitle = document.getElementById('display-title');
    const displayArtist = document.getElementById('display-artist');
    
    const tracks = document.getElementById('playlist-data').getElementsByTagName('li');
    let currentTrackIndex = 0;
    let previousVolume = 0.8;

    function loadTrack(index) {
        if (tracks.length === 0) return;
        const currentTrack = tracks[index];
        audioPlayer.src = currentTrack.getAttribute('data-src');
        displayTitle.textContent = currentTrack.getAttribute('data-title') || "Unknown Title";
        displayArtist.textContent = currentTrack.getAttribute('data-artist') || "Unknown Artist";
        currentTrackIndex = index;
    }

    function togglePlay() {
        if (audioPlayer.paused) {
            audioPlayer.play();
            playBtn.textContent = '⏸';
        } else {
            audioPlayer.pause();
            playBtn.textContent = '▶';
        }
    }

    playBtn.addEventListener('click', togglePlay);

    nextBtn.addEventListener('click', function() {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(currentTrackIndex);
        audioPlayer.play();
        playBtn.textContent = '⏸';
    });

    prevBtn.addEventListener('click', function() {
        currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
        loadTrack(currentTrackIndex);
        audioPlayer.play();
        playBtn.textContent = '⏸';
    });

    audioPlayer.addEventListener('ended', function() {
        currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
        loadTrack(currentTrackIndex);
        audioPlayer.play();
    });

    // Volume Slider Control
    volumeSlider.addEventListener('input', function(e) {
        const volumeVal = e.target.value;
        audioPlayer.volume = volumeVal;
        audioPlayer.muted = (volumeVal == 0);
        updateVolumeIcon(volumeVal);
    });

    // Mute/Unmute Button Click Logic
    volumeBtn.addEventListener('click', function() {
        if (audioPlayer.muted || audioPlayer.volume === 0) {
            audioPlayer.muted = false;
            audioPlayer.volume = previousVolume > 0 ? previousVolume : 0.8;
            volumeSlider.value = audioPlayer.volume;
        } else {
            previousVolume = audioPlayer.volume;
            audioPlayer.muted = true;
            audioPlayer.volume = 0;
            volumeSlider.value = 0;
        }
        updateVolumeIcon(audioPlayer.volume);
    });

    function updateVolumeIcon(volumeVal) {
        if (volumeVal == 0 || audioPlayer.muted) {
            volumeBtn.textContent = '🔇';
        } else if (volumeVal < 0.4) {
            volumeBtn.textContent = '🔈';
        } else {
            volumeBtn.textContent = '🔊';
        }
    }

    // Set Initial Startup Volume
    audioPlayer.volume = volumeSlider.value;
    loadTrack(currentTrackIndex);
</script>

</body>
</html>
